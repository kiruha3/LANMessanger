name: Build macOS (experimental)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-regression:
    name: Windows regression tests
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements.txt
      - run: python scripts/run_tests.py

  macos:
    name: macOS ${{ matrix.arch }}
    needs: windows-regression
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-build.txt
      - run: python scripts/build_macos.py
      - uses: actions/upload-artifact@v7
        with:
          name: LANMessenger-macos-${{ matrix.arch }}
          path: dist/macos/${{ matrix.arch }}/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
